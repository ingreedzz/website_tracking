name: Smoke Tests

on:
  # Run on pull requests
  pull_request:
    branches: [ main ]
  
  # Run on pushes to main
  push:
    branches: [ main ]
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL to test (default: production)'
        required: false
        default: 'https://website-tracking.onrender.com'

jobs:
  smoke-test:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm ci
          echo "Dependencies installed successfully"
      
      - name: Wait for deployment (if applicable)
        if: github.event_name == 'pull_request'
        run: |
          echo "Waiting 30 seconds for preview deployment to be ready..."
          sleep 30
      
      - name: Run smoke tests against production
        if: github.event_name != 'workflow_dispatch'
        run: |
          echo "Running smoke tests against production..."
          node smoke-test.js https://website-tracking.onrender.com
        continue-on-error: false
      
      - name: Run smoke tests against custom URL
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Running smoke tests against ${{ github.event.inputs.target_url }}"
          node smoke-test.js ${{ github.event.inputs.target_url }}
        continue-on-error: false
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: |
            smoke-test-*.log
            tmp/
          retention-days: 7
          if-no-files-found: ignore
